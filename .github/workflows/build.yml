name: Build GTA IV TGHMod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ScriptHookDotNet CE
        uses: actions/checkout@v4
        with:
          repository: Priler/gta4_scripthookdotnet
          path: shdn

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ScriptHookDotNet
        shell: pwsh
        run: |
          $sln = Get-ChildItem "shdn" -Filter "*.sln" -Recurse |
            Select-Object -First 1

          if (-not $sln) {
            throw "ScriptHookDotNet solution not found."
          }

          Write-Host "Building:"
          Write-Host $sln.FullName

          msbuild $sln.FullName `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "ScriptHookDotNet build failed."
          }

      - name: Install .NET Framework 4.0 Reference Assemblies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "packages" | Out-Null

          Invoke-WebRequest `
            -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" `
            -OutFile "nuget.exe"

          .\nuget.exe install Microsoft.NETFramework.ReferenceAssemblies `
            -Version 1.0.3 `
            -OutputDirectory "packages" `
            -NonInteractive

          $ref = Get-ChildItem `
            "packages\Microsoft.NETFramework.ReferenceAssemblies*" `
            -Directory `
            -Recurse |
            Where-Object { $_.Name -eq "v4.0" } |
            Select-Object -First 1

          if (-not $ref) {
            throw ".NET Framework 4.0 reference assemblies were not found."
          }

          Write-Host "Found .NET Framework 4.0 reference assemblies:"
          Write-Host $ref.FullName

          "NET40_REF=$($ref.FullName)" >> $env:GITHUB_ENV

      - name: Build TGHMod
        shell: pwsh
        run: |
          if (-not (Test-Path "TGHMod.csproj")) {
            throw "TGHMod.csproj not found."
          }

          Write-Host "Building TGHMod against .NET Framework 4.0..."

          msbuild "TGHMod.csproj" `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /p:TargetFrameworkRootPath="$env:NET40_REF\..\.." `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "TGHMod build failed."
          }

          Write-Host "TGHMod build completed successfully."

      - name: Show TGHMod output
        shell: pwsh
        run: |
          Write-Host "TGHMod output files:"

          if (Test-Path "bin") {
            Get-ChildItem "bin" -Recurse -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }
          else {
            throw "bin directory was not created."
          }

      - name: Prepare final package
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release\scripts" | Out-Null

          $tgh = Get-ChildItem `
            "bin" `
            -Filter "TGHMod.net.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $tgh) {
            throw "TGHMod.net.dll was not produced."
          }

          Copy-Item `
            $tgh.FullName `
            "release\scripts\TGHMod.dll" `
            -Force

          if (Test-Path "ScriptHookDotNet.asi") {
            Copy-Item `
              "ScriptHookDotNet.asi" `
              "release\ScriptHookDotNet.asi" `
              -Force
          }

          if (Test-Path "aCompleteEditionHook.asi") {
            Copy-Item `
              "aCompleteEditionHook.asi" `
              "release\aCompleteEditionHook.asi" `
              -Force
          }

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: TGHMod-GTAIV-CE-1.2.0.59-FINAL
          path: release
