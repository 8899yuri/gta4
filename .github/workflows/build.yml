name: Build TGHMod
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TGHMod
        shell: cmd
        run: |
          msbuild TGHMod.csproj /p:Configuration=Release /p:Platform=x86

      - name: Prepare Package
        shell: cmd
        run: |
          mkdir release\scripts
          copy bin\Release\TGHMod.net.dll release\scripts\TGHMod.net.dll
          copy ScriptHookDotNet.asi release\ScriptHookDotNet.asi
          copy aCompleteEditionHook.asi release\aCompleteEditionHook.asi
          copy AdvancedHook.dll release\AdvancedHook.dll
          copy AdvancedHookInit.asi release\AdvancedHookInit.asi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGHMod-GTAIV-CE-FINAL
          path: release
