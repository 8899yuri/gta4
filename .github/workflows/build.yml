name: Build TGHMod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore TGHMod
        shell: cmd
        run: |
          dotnet restore TGHMod.csproj

      - name: Build TGHMod
        shell: cmd
        run: |
          dotnet build TGHMod.csproj -c Release --no-restore -p:Platform=x86

      - name: Dump ScriptHookDotNet API
        shell: pwsh
        run: |
          dotnet tool install ilspycmd --tool-path ./ilspy
          ./ilspy/ilspycmd.exe ScriptHookDotNet.dll -o api_dump

      - name: Upload API dump
        uses: actions/upload-artifact@v4
        with:
          name: api_dump
          path: api_dump

      - name: Prepare Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\scripts | Out-Null
          
          # 全局搜索生成的 DLL，不管它在哪一层目录
          $dll = Get-ChildItem -Path bin -Filter TGHMod.net.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw "TGHMod.net.dll not found after build!" }
          
          Write-Host "Found DLL at: $($dll.FullName)"
          Copy-Item $dll.FullName release\scripts\TGHMod.net.dll
          
          Copy-Item ScriptHookDotNet.asi release\ScriptHookDotNet.asi
          Copy-Item aCompleteEditionHook.asi release\aCompleteEditionHook.asi
          Copy-Item AdvancedHook.dll release\AdvancedHook.dll
          Copy-Item AdvancedHookInit.asi release\AdvancedHookInit.asi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGHMod-GTAIV-CE-FINAL
          path: release
