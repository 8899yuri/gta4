      # 把下面这两个 step 加到 build.yml 的 steps 里（和其他 step 缩进对齐）
      # 作用：在 GitHub 上反编译 ScriptHookDotNet.dll，导出它真实的 API，
      # 这样不用电脑也能看到正确的类名和方法名。

      - name: Dump ScriptHookDotNet API
        shell: pwsh
        run: |
          dotnet tool install ilspycmd --tool-path ./ilspy
          ./ilspy/ilspycmd.exe ScriptHookDotNet.dll -o api_dump

      - name: Upload API dump
        uses: actions/upload-artifact@v4
        with:
          name: api_dump
          path: api_dump
