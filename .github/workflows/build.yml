name: Build GTA IV TGHMod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ScriptHookDotNet CE
        shell: pwsh
        run: |
          if (-not (Test-Path "shdn.zip")) {
            throw "shdn.zip not found."
          }

          New-Item -ItemType Directory -Force -Path shdn | Out-Null
          Expand-Archive -Path "shdn.zip" -DestinationPath "shdn" -Force

          Write-Host "Extracted ScriptHookDotNet source:"
          Get-ChildItem shdn -Recurse -File | Select-Object FullName

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find ScriptHookDotNet solution
        shell: pwsh
        run: |
          $sln = Get-ChildItem "shdn" -Filter "*.sln" -Recurse |
            Select-Object -First 1

          if (-not $sln) {
            throw "ScriptHookDotNet solution not found inside shdn.zip."
          }

          Write-Host "Found solution:"
          Write-Host $sln.FullName

          "SLN_PATH=$($sln.FullName)" >> $env:GITHUB_ENV

      - name: Build ScriptHookDotNet
        shell: pwsh
        run: |
          msbuild "$env:SLN_PATH" /p:Configuration=Release /p:Platform=Win32 /m

      - name: Find ScriptHookDotNet.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem "shdn" -Filter "ScriptHookDotNet.dll" -Recurse |
            Where-Object { $_.FullName -notmatch '\\obj\\' } |
            Select-Object -First 1

          if (-not $dll) {
            throw "ScriptHookDotNet.dll not found after build."
          }

          Write-Host "Found:"
          Write-Host $dll.FullName

          New-Item -ItemType Directory -Force -Path "shdn\bin" | Out-Null
          Copy-Item $dll.FullName "shdn\bin\ScriptHookDotNet.dll" -Force

      - name: Build TGHMod
        shell: pwsh
        run: |
          if (-not (Test-Path "TGHMod.csproj")) {
            throw "TGHMod.csproj not found."
          }

          msbuild "TGHMod.csproj" /p:Configuration=Release /p:Platform=x86 /m

          if (-not (Test-Path "bin\TGHMod.net.dll")) {
            throw "TGHMod.net.dll was not produced."
          }

      - name: Prepare final package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\scripts" | Out-Null

          Copy-Item "bin\TGHMod.net.dll" "release\scripts\TGHMod.dll" -Force

          if (Test-Path "ScriptHookDotNet.asi") {
            Copy-Item "ScriptHookDotNet.asi" "release\ScriptHookDotNet.asi" -Force
          }

          if (Test-Path "aCompleteEditionHook.asi") {
            Copy-Item "aCompleteEditionHook.asi" "release\aCompleteEditionHook.asi" -Force
          }

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: TGHMod-GTAIV-CE-1.2.0.59-FINAL
          path: release
